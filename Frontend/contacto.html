<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pasteleria Mil Sabores - Contactate con Nosotros</title>
        <link rel="stylesheet" href="css/style-registro.css">
    </head>
    <body>
        <!-- ENCABEZADO PRINCIPAL -->
         <header class="header">
            <div class="title">
                <span><h2>PASTELERIA MIL SABORES</h2></span>
            </div>
            <!--  MENU DE NAVEGACION | HOME | NOSOTROS | BLOGS | PRODUCTOS -->
            <nav class="nav">
                <a href="index.html">Inicio</a>
                <a href="catalogo.html">Catalogo</a>
                <a href="blogs.html">Blogs</a>
                <a href="nuestra-historia.html">Nuestra Historia</a>
                <a href="login.html">Inicio Sesion</a>
                <a href="registro.html">Registrate</a>
            </nav>
            <div class="cart">
                <a href="carrito.html"><img src="img/carrito.png" alt="Carrito de compras">Carrito</a>
            </div>
         </header>
             <main class="register-container">
                <section class="register-card">
                <h1>Contactanos</h1>
                <p>Si tienes alguna duda, sugerencia o consulta, escribenos</p>
                <form id="contacto-form">
                    <div class="form">
                        <label for="nombreContacto">Nombre *</label>
                        <input type="text" id="nombreContacto" placeholder="Ingresa tu nombre">
                        <small id="errorNombreContacto" class="error"></small>
                    </div>

                    <div class="form">
                        <label for="correoContacto">Correo *</label>
                        <input type="email" id="correoContacto" placeholder="ejemplo@gmail.com">
                        <small id="errorCorreoContacto" class="error"></small>
                    </div>

                    <div class="form">
                        <label for="comentario">Comentario *</label>
                        <textarea id="comentario" maxlength="500" placeholder="Escribe tu comentario"></textarea>
                        <small id="errorComentario" class="error"></small>
                    </div>
                </form>
                </section>
             </main>
        <footer class="footer">
            <p>@ 2026 Pasteleria Mil Sabores - 50 Aniversario. Todos los derechos reservados</p>
        </footer>
        <script src="js/contacto.js"></script>
    </body>
</html>
