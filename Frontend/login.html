<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pasteleria 1000 Sabores - Inicio</title>
        <link rel="stylesheet" href="css/style-login.css">
    </head>
    <body>
        <!-- ENCABEZADO PRINCIPAL -->
         <header class="header">
            <div class="title">
                <span><h2>PASTELERIA MIL SABORES</h2></span>
            </div>
            <!--  MENU DE NAVEGACION | HOME | NOSOTROS | BLOGS | PRODUCTOS -->
            <nav class="nav">
                <a href="index.html">Inicio</a>
                <a href="catalogo.html">Catalogo</a>
                <a href="blogs.html">Blogs</a>
                <a href="nuestra-historia.html">Nuestra Historia</a>
                <a href="login.html">Inicio Sesion</a>
                <a href="registro.html">Registrate</a>
            </nav>
            <!-- CARRITO DE COMPRAS -->
             <div class="cart">
                <a href="carrito.html"><img src="img/carrito.png">Carrito</a>
             </div>
         </header>
         <!-- CONTENEDOR DEL LOGIN -->
         <main class="login-container">
            <section class="login">
                <h1>PASTELERIA MIL SABORES</h1>
                <p>Innovacion y tradicion en la reposteria desde 1976</p>
                <img src="img/imagen-central.png" alt="Imagen de la Pasteleria">
                <br>
                <form id="loginFrom">
                    <div class="Form">
                        <label for="correo">Correo Electronico</label> 
                        <input type="email" id="correo" name="correo" placeholder="Ejemplo@correo.cl">
                    </div>
                    <br>
                    <div class="Form">
                        <label for="contraseña">Contraseña</label>
                        <input type="password" id="contraseña" name="contraseña" placeholder="********">
                    </div>
                    <br>
                    <button type="submit" class="btn-login">Ingresar</button>
                </form>
                <div class="login-footer">
                    <p>¿No tienes una cuenta? <a href="registro.html">Registrate</a></p>
                </div>
            </section>

         </main>

         <!-- FOOTER-->
          <footer class="footer">
            <p>© 2026 Pasteleria Mil Sabores. Todos los derechos reservados.</p>
          </footer>
        <script src="js/login.js"></script>
    </body>
</html>
